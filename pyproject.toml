[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "nba-commish"
version = "0.1.0"
description = "NBA commissioner tools."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "hatchling>=1.31.0",
    "pre-commit>=4.6.2",
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/nba_commish"]

[tool.ruff]
target-version = "py312"

[tool.pytest.ini_options]
addopts = "--capture=sys"
